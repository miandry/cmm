mz_clinic.save_consultation:
  path: "/api/clinic/save-consultation"
  defaults:
    _controller: '\Drupal\mz_clinic\Controller\ClinicController::saveConsultation'
    _title: "Save complete consultation"
  methods: [POST]
  requirements:
    _access: "TRUE"
  options:
    no_cache: TRUE

mz_clinic.cancel_consultation:
  path: "/api/clinic/cancel-consultation"
  defaults:
    _controller: '\Drupal\mz_clinic\Controller\ClinicController::cancelConsultation'
    _title: "Cancel consultation and associated order"
  methods: [POST]
  requirements:
    _access: "TRUE"
  options:
    no_cache: TRUE

mz_clinic.create_order_with_invoice:
  path: "/api/clinic/create-order-with-invoice"
  defaults:
    _controller: '\Drupal\mz_clinic\Controller\ClinicController::createOrderWithInvoice'
    _title: "Create order and invoice together"
  methods: [POST]
  requirements:
    _access: "TRUE"
  options:
    no_cache: TRUE

mz_clinic.invoice_header_get:
  path: "/api/clinic/invoice-header"
  defaults:
    _controller: '\Drupal\mz_clinic\Controller\ClinicController::getInvoiceHeader'
    _title: "Get invoice header settings"
  methods: [GET]
  requirements:
    _access: "TRUE"
  options:
    no_cache: TRUE

mz_clinic.invoice_header_save:
  path: "/api/clinic/invoice-header"
  defaults:
    _controller: '\Drupal\mz_clinic\Controller\ClinicController::saveInvoiceHeader'
    _title: "Save invoice header settings"
  methods: [POST]
  requirements:
    _access: "TRUE"
  options:
    no_cache: TRUE

mz_clinic.menu_settings_get:
  path: "/api/clinic/menu-settings"
  defaults:
    _controller: '\Drupal\mz_clinic\Controller\ClinicController::getMenuSettings'
    _title: "Get menu visibility settings"
  methods: [GET]
  requirements:
    _access: "TRUE"
  options:
    no_cache: TRUE

mz_clinic.menu_settings_save:
  path: "/api/clinic/menu-settings"
  defaults:
    _controller: '\Drupal\mz_clinic\Controller\ClinicController::saveMenuSettings'
    _title: "Save menu visibility settings"
  methods: [POST]
  requirements:
    _access: "TRUE"
  options:
