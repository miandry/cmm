service.add:
  path: '/admin/clinic/service/add'
  defaults:
    _title: 'Ajouter un service'
    _entity_form: 'node.service.default'
  requirements:
    _permission: 'create service content'
    _entity_create_access: 'node:service'

service.collection:
  path: '/admin/clinic/services'
  defaults:
    _title: 'Services clinic'
    _controller: '\Drupal\mz_clinic\Controller\ServiceAdminController::listServices'
  requirements:
    _permission: 'administer clinic services'
